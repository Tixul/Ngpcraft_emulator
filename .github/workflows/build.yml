# Build the emulator for Windows, Linux and macOS.
#
# PyInstaller cannot cross-compile, so each OS builds itself on its own runner --
# that is the whole reason this exists: GitHub hands us the three machines we do
# not have locally. Each job does the same four things: build the C++ core with
# CMake, install the Python deps, run the tests, then package with PyInstaller.
#
# Triggers:
#   * push of a tag like v2.1  -> builds AND attaches the three artefacts to a
#     GitHub Release
#   * the "Run workflow" button -> builds and uploads artefacts you can download
#     from the run page (no release). Use this to try a build without tagging.
#
# PyInstaller applies ad-hoc signing on macOS. Developer ID signing and
# notarization are not configured here.

name: build

on:
  workflow_dispatch:        # the manual "Run workflow" button
  push:
    tags:
      - 'v*'                # v2.1, v2.1.0, ...

permissions:
  contents: write           # needed to create a Release on a tag

jobs:
  build:
    strategy:
      fail-fast: false      # one OS failing must not cancel the other two
      matrix:
        include:
          - os: windows-latest
            asset: NgpCraftEmulator-windows.zip
          - os: ubuntu-latest
            asset: NgpCraftEmulator-linux.tar.gz
          - os: macos-latest
            asset: NgpCraftEmulator-macos.zip

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'      # matches the local toolchain; floor is 3.10

      # Linux runners are headless and ship almost none of the shared libraries Qt
      # links. PyQt6.QtGui needs EGL/GL/xkbcommon/dbus even under the offscreen
      # platform, and PyQt6.QtMultimedia (imported for audio in ngpc_shell.py)
      # links libpulse -- without it, importing the module fails at collection
      # with "libpulse.so.0: cannot open shared object file". Windows/macOS bundle
      # their own audio stack, so this step is Linux-only.
      - name: Install system libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libegl1 libgl1 libxkbcommon0 libdbus-1-3 \
            libpulse0 libpulse-mainloop-glib0

      # Build the native core. CMake picks each platform's own compiler (MSVC on
      # Windows, GCC on Linux, Clang on macOS); the CMakeLists already handles the
      # runtime-linking differences.
      - name: Build the C++ core
        run: |
          cmake -S cpp -B cpp/build -DCMAKE_BUILD_TYPE=Release
          cmake --build cpp/build --config Release

      # MSVC drops the .dll in a Release/ subfolder; the spec expects it directly
      # under cpp/build/ (where the MinGW build already puts it). Move it if needed.
      - name: Normalise the core location (Windows MSVC)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          if [ -f cpp/build/Release/ngpc_core.dll ]; then
            mv cpp/build/Release/ngpc_core.dll cpp/build/ngpc_core.dll
          fi

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest pyinstaller

      # The suite runs headless everywhere (QT_QPA_PLATFORM=offscreen is set by the
      # tests themselves). A red suite must stop the build -- shipping a broken
      # binary is worse than shipping none.
      - name: Run the tests
        env:
          QT_QPA_PLATFORM: offscreen
        # -v, not -q: when the process dies outright (no summary, "exit code 1"), the
        # dots of -q do not say WHICH test was running -- and on Windows faulthandler
        # also prints "fatal exception" for faults something else then handles, so its
        # dump alone can point at the wrong test. One name per line pins the real one.
        run: pytest -v

      # The binary must know which release it is, or the update check
      # (ngpc_update.py) has nothing to compare with GitHub's latest tag. Only a TAG
      # build gets a number: a "Run workflow" build stays "dev", which never offers
      # to update itself. After the tests, so they always run the committed file.
      - name: Stamp the version (tag builds)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: printf 'VERSION = "%s"\n' "${GITHUB_REF_NAME#v}" > ngpc_version.py

      - name: Package with PyInstaller
        run: pyinstaller --noconfirm --clean NgpCraftEmulator.spec

      - name: Inspect packaged macOS app
        if: runner.os == 'macOS'
        shell: bash
        run: |
          app='dist/NgpCraftEmulator.app'
          python - <<'PY'
          import os
          import plistlib
          from pathlib import Path

          app = Path('dist/NgpCraftEmulator.app').resolve()
          info = plistlib.loads((app / 'Contents/Info.plist').read_bytes())
          executable = app / 'Contents/MacOS' / info['CFBundleExecutable']
          assert executable.is_file() and os.access(executable, os.X_OK), executable
          frameworks = app / 'Contents/Frameworks'
          resources = app / 'Contents/Resources'
          python_libraries = list(frameworks.glob('Python.framework/Versions/*/Python'))
          python_libraries += list(frameworks.glob('libpython*.dylib'))
          assert any(path.is_file() for path in python_libraries), 'Python shared library'
          for relative in ('PyQt6/Qt6/lib/QtCore.framework', 'cpp/build/ngpc_core.dylib'):
              assert (frameworks / relative).exists(), relative
          assert (resources / info['CFBundleIconFile']).is_file(), 'bundle icon'
          sources = [Path('hle_bios/bios_hle.bin'),
                     Path('assets/icone_ngpcraft.ico'), Path('assets/ngpc_console.png')]
          sources += [path for path in Path('lang').rglob('*') if path.is_file()]
          for source in sources:
              packaged = resources / source
              assert packaged.is_file(), packaged
              assert packaged.read_bytes() == source.read_bytes(), source
          for path in app.rglob('*'):
              if path.is_symlink():
                  assert path.exists(), f'broken symlink: {path}'
                  assert path.resolve().is_relative_to(app), f'external symlink: {path}'
          print(f'Checked {len(sources)} resources and all bundle symlinks')
          PY
          file "$app/Contents/MacOS/NgpCraftEmulator" "$app/Contents/Frameworks/cpp/build/ngpc_core.dylib"
          codesign --verify --deep --strict "$app"
          du -sh "$app"

      # One clean archive per OS, so a Release carries exactly three downloads.
      # Each is made ON its own runner, which matters most for macOS: the build is
      # a .app *bundle* (a directory), and `ditto` is Apple's tool that zips it
      # while preserving the bundle layout and the executable bit -- a plain folder
      # upload would explode into loose files and lose the +x, and the .app would
      # not launch. Windows uses PowerShell's Compress-Archive; Linux uses tar,
      # which keeps the binary's executable bit.
      - name: Archive (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path dist/NgpCraftEmulator.exe -DestinationPath ${{ matrix.asset }}

      - name: Archive (Linux)
        if: runner.os == 'Linux'
        run: tar -C dist -czf ${{ matrix.asset }} NgpCraftEmulator

      - name: Archive (macOS)
        if: runner.os == 'macOS'
        run: ditto -c -k --keepParent dist/NgpCraftEmulator.app ${{ matrix.asset }}

      - name: Upload the build
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}
          if-no-files-found: error

  # On a tag, gather the three archives into one GitHub Release. `merge-multiple`
  # drops them all straight into artifacts/ (no per-artifact subfolders), so the
  # release attaches exactly the three files and nothing else.
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
