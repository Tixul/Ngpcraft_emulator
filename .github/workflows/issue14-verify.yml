name: Issue 14 validation gate

on:
  push:
    branches:
      - fix/issue14-mirror-scheduler-lifecycle

permissions:
  contents: write

jobs:
  validate-and-land-only-if-green:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply all three files against original full checkout
        run: |
          git apply --check .github/issue14-validation.patch
          git apply .github/issue14-validation.patch
          git diff --check
          python -m py_compile core/netplay.py core/lobby.py ngpc_shell.py
      - name: Install Linux Qt shared libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3 libpulse0 libpulse-mainloop-glib0
      - name: Build latest native C++ core
        run: |
          cmake -S cpp -B cpp/build -DCMAKE_BUILD_TYPE=Release
          cmake --build cpp/build --config Release --parallel 2
      - name: Install Python test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest
      - name: Run COMPLETE upstream Python tests
        env:
          QT_QPA_PLATFORM: offscreen
          PYTHONFAULTHANDLER: '1'
        run: python -m pytest -v
      - name: Publish only fully verified code to this fork branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add core/netplay.py core/lobby.py ngpc_shell.py tests/test_netplay_mirror.py
          git rm -f .github/workflows/issue14-verify.yml .github/issue14-validation.patch
          git commit -m 'fix(netplay): coordinate mirror scheduler and update HELLO-dependent regression [skip ci]'
          git push origin HEAD:refs/heads/fix/issue14-mirror-scheduler-lifecycle
